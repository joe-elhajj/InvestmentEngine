# =====================================================================
# Investment Engine — configuration
# Everything that is an ASSUMPTION or a JUDGMENT lives here, in version
# control, owned by you. The code never invents these at runtime.
# =====================================================================

sec:
  # REQUIRED by the SEC. Use your real name + email or you will get 403s.
  user_agent: "Joe El Hajj - Investment Engine - joeelhajj01@icloud.com"
  request_delay_seconds: 0.2          # ~5 req/s, well under SEC's limit

report:
  output_dir: "reports"
  history_years: 15                   # how far back to pull annual data

classification:
  # Analyst-owned overrides for security classification.
  # Ticker → class.  Accepted values: "operating" (bypass financial-SIC exclusion)
  # Overrides win over ALL form-history inference AND over the SIC 6000-6799 exclusion.
  overrides:
    MARA: operating        # Bitcoin miner; filed 10-K; SIC 6199 (services-finance)

valuation:
  assumed_tax_rate: 0.21              # used for NOPAT in ROIC; your assumption
  normalized_fcf_years: 5             # C1: median FCF margin computed over last N fiscal years
  min_history_years: 4                # C2: min annual points needed for delivered_growth CAGR
  dcf:
    projection_years: 5
    # ---- scenarios: you own every number here ----
    scenarios:
      bear:
        fcf_growth: [0.03, 0.03, 0.02, 0.02, 0.02]
        terminal_growth: 0.015
        wacc: 0.11
      base:
        fcf_growth: [0.08, 0.07, 0.06, 0.05, 0.04]
        terminal_growth: 0.025
        wacc: 0.09
      bull:
        fcf_growth: [0.14, 0.12, 0.10, 0.08, 0.06]
        terminal_growth: 0.030
        wacc: 0.08
    # ---- sensitivity grid for the BASE scenario ----
    sensitivity:
      wacc:            [0.07, 0.08, 0.09, 0.10, 0.11]
      terminal_growth: [0.015, 0.020, 0.025, 0.030, 0.035]

peers:
  # The target is compared only against names that pass BOTH filters below.
  match_sic: "two_digit"              # two_digit | three_digit | exact
  size_band:
    metric: "market_cap"              # falls back to revenue if no market cap
    lower_multiple: 0.25              # peer size must be >= 0.25x target
    upper_multiple: 4.0               # ... and <= 4x target
  exclusions: []                      # tickers to always drop from any comp set

  # Analyst-curated candidate universes. You maintain these; the engine just
  # enforces SIC + size discipline on top. Add your own sectors over time.
  universes:
    technology:
      - AAPL
      - MSFT
      - GOOGL
      - DELL
      - HPQ
    semiconductors:
      - NVDA
      - AMD
      - INTC
      - AVGO
      - QCOM

universe:
  # Analyst-owned reference population for peer-relative percentile scoring.
  # Update `file` if the universe file moves. Bump `version` after each S&P
  # quarterly rebalance (March, June, September, December); the version is
  # folded into the durability config-hash so scores from different universe
  # snapshots are NOT silently compared.
  file: config/sp500_universe.txt
  version: "2026-Q3"   # bump on next rebalance; treat as an auditable event

durability:
  weights:
    reinvestment_engine: 0.30
    quality_persistence: 0.25
    balance_sheet_resilience: 0.20
    capital_discipline: 0.15
    optionality_proxies: 0.10
  thresholds:
    roic_cost_of_capital: 0.08
    roic_above_threshold: 0.15
    stability_flag_delta: 5.0
  score_band:
    pessimistic_impute: 25.0
    optimistic_impute: 75.0

web:
  # Local FastAPI web layer (app/) — operational, not an analyst assumption.
  # How long a fetched AnalysisResult is reused across the full-page/json/
  # fragment analyze endpoints before the next request re-hits EDGAR/yfinance.
  analysis_cache_ttl_seconds: 3600

flags:
  # Tier 2 — qualitative red/green flag extraction (engine/flags.py). The
  # ONLY LLM call in the codebase; pinned here, never hardcoded, so a model
  # or prompt change is a version-controlled, auditable event. No
  # `temperature` setting: current-generation models (claude-sonnet-5
  # included) reject the parameter outright (400 invalid_request_error),
  # so engine/flags.py never sends it — nothing here would take effect.
  # prompt_version bump whenever _SYSTEM_PROMPT changes materially — it's
  # part of the extraction cache key, so a bump forces re-extraction on next
  # request rather than silently reusing a stale cached result.
  model: "claude-sonnet-5"
  prompt_version: v1

  # Spend control (app/usage.py, app/main.py's /api/flags/{ticker} gate).
  # Keyed by the exact model string above — the extraction endpoint looks
  # up pricing by whichever model is pinned, so this table can carry
  # entries for models you're not currently using without affecting cost.
  # Prices are looked up AT CALL TIME and stamped onto the usage row, so a
  # price edit here never retroactively changes a historical row's cost.
  pricing:
    # Introductory pricing through 2026-08-31; reverts to $3.00 / $15.00 per
    # million after that — bump this entry when it does, or cost stamping
    # silently undercharges every call by a third.
    claude-sonnet-5:
      input_per_million: 2.00
      output_per_million: 10.00
    claude-sonnet-4-6:
      input_per_million: 3.00
      output_per_million: 15.00
    claude-haiku-4-5-20251001:
      input_per_million: 0.80
      output_per_million: 4.00

  # Analyst-owned deterministic post-processing of the model's output, by
  # EXACT label match — same "overrides win" pattern as
  # classification.overrides. Applied fresh on every /api/flags/{ticker}
  # request (never cached), so editing this section takes effect
  # immediately without a re-extraction.
  overrides: {}
  # Example shape (see engine/flags.py's validate_flags_config for the
  # exact rules this is checked against at startup):
  #   overrides:
  #     NVDA:
  #       add:
  #         - label: "Customer concentration"
  #           snippet: "our largest customer accounted for approximately 19% of revenue"
  #           severity: red
  #           item: "1A"
  #           # snippet above must be an EXACT substring of the fetched
  #           # Item 1A text — verbatim-validated exactly like a model
  #           # selection. Omit `source` for a filing-sourced add.
  #         - label: "Guidance cut on Q3 call"
  #           snippet: "management lowered full-year guidance by 200bps"
  #           severity: yellow
  #           item: "1A"
  #           source: analyst   # NOT from the filing (e.g. an earnings
  #                             # call) — trusted as given, NOT verbatim-
  #                             # checked, tagged distinctly in the UI.
  #       demote: ["Some flag label the model over-weighted"]
  #       remove: ["Some flag label that's boilerplate, not company-specific"]

council:
  # Tier 3 — adversarial council synthesis (engine/council.py). Deliberately
  # reuses flags.model and flags.pricing above directly rather than owning
  # a separate model/pricing table: one pinned model, one spend ledger
  # pricing table for the whole codebase's only two LLM surfaces.
  # prompt_version bumps whenever any of the Round 1/2/3 prompts change
  # materially — it's part of the council cache key, so a bump forces
  # re-convening on the next request rather than silently reusing a stale
  # cached run.
  prompt_version: v1
